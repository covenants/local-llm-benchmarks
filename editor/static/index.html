<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Code Editor — Qwen3-Coder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1e1e1e;
    --panel:     #252526;
    --border:    #3c3c3c;
    --accent:    #0e7eff;
    --accent-h:  #1a8fff;
    --text:      #cccccc;
    --text-dim:  #888;
    --success:   #4ec9b0;
    --warn:      #ce9178;
    --toolbar:   #323233;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--toolbar);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #toolbar .logo {
    font-weight: 700;
    font-size: 13px;
    color: var(--accent);
    margin-right: 8px;
    white-space: nowrap;
  }
  #toolbar select, #toolbar input[type=text] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    outline: none;
  }
  #toolbar select:focus, #toolbar input:focus { border-color: var(--accent); }
  .tb-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .tb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
  }
  #status-dot.ok  { background: var(--success); }
  #status-dot.err { background: #f44; }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Editor panel ── */
  #editor-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    border-right: 1px solid var(--border);
  }
  #editor-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }
  #filename-display { color: var(--text); font-weight: 500; }
  #editor-container { flex: 1; overflow: hidden; }

  /* ── AI panel ── */
  #ai-panel {
    display: flex;
    flex-direction: column;
    width: 420px;
    min-width: 320px;
    flex-shrink: 0;
  }

  #ai-header {
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #model-tag {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-dim);
    margin-left: auto;
  }

  /* Action buttons */
  #action-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .action-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }
  .action-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Chat history */
  #chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 13px;
    line-height: 1.6;
  }
  #chat-history::-webkit-scrollbar { width: 6px; }
  #chat-history::-webkit-scrollbar-track { background: transparent; }
  #chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { display: flex; flex-direction: column; gap: 4px; }
  .msg-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .msg.user .msg-label  { color: var(--accent); }
  .msg.ai   .msg-label  { color: var(--success); }
  .msg-body {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-body { border-color: #2a4a7f; background: #1e3a5f22; }

  /* Code blocks inside AI responses */
  .msg-body code {
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
  }
  .msg-body pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    overflow-x: auto;
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 4px; right: 4px;
    background: var(--border);
    border: none;
    color: var(--text);
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 10px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .msg-body pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--accent); }

  /* Insert to editor button */
  .insert-btn {
    margin-top: 4px;
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  .insert-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Typing indicator */
  #typing { display: none; color: var(--text-dim); font-size: 12px; padding: 0 12px 6px; }
  #typing.active { display: block; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #typing span { animation: blink 1s infinite; }

  /* Input area */
  #input-area {
    padding: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #chat-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 60px;
    max-height: 150px;
  }
  #chat-input:focus { border-color: var(--accent); }
  #input-footer {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #use-selection {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  #send-btn {
    margin-left: auto;
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  #send-btn:hover { background: var(--accent-h); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Resizer */
  #resizer {
    width: 4px;
    cursor: col-resize;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.15s;
  }
  #resizer:hover, #resizer.dragging { background: var(--accent); }
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <span class="logo">⚡ Local Code Editor</span>

  <select id="language-select">
    <option value="python">Python</option>
    <option value="javascript">JavaScript</option>
    <option value="typescript">TypeScript</option>
    <option value="java">Java</option>
    <option value="cpp">C++</option>
    <option value="rust">Rust</option>
    <option value="go">Go</option>
    <option value="markdown">Markdown</option>
    <option value="json">JSON</option>
    <option value="shell">Shell</option>
  </select>

  <button class="tb-btn" onclick="openFile()">Open</button>
  <button class="tb-btn" onclick="saveFile()">Save</button>
  <button class="tb-btn" onclick="clearEditor()">New</button>

  <div class="spacer"></div>
  <div id="status-dot" title="Ollama status"></div>
  <span id="status-text" style="font-size:11px;color:var(--text-dim)">Connecting…</span>
</div>

<!-- Main -->
<div id="main">

  <!-- Editor -->
  <div id="editor-panel">
    <div id="editor-header">
      <span id="filename-display">untitled.py</span>
      <span style="margin-left:auto;font-size:11px" id="cursor-pos">Ln 1, Col 1</span>
    </div>
    <div id="editor-container"></div>
  </div>

  <!-- Resizer -->
  <div id="resizer"></div>

  <!-- AI Panel -->
  <div id="ai-panel">
    <div id="ai-header">
      AI Assistant
      <span id="model-tag">qwen3-coder-30b</span>
    </div>

    <div id="action-bar">
      <button class="action-btn" onclick="runAction('explain')">Explain</button>
      <button class="action-btn" onclick="runAction('fix')">Fix Bugs</button>
      <button class="action-btn" onclick="runAction('complete')">Complete</button>
      <button class="action-btn" onclick="runAction('refactor')">Refactor</button>
      <button class="action-btn" onclick="runAction('tests')">Write Tests</button>
      <button class="action-btn" onclick="runAction('docstring')">Add Docs</button>
    </div>

    <div id="chat-history"></div>

    <div id="typing"><span>▋</span> Generating…</div>

    <div id="input-area">
      <textarea id="chat-input" placeholder="Ask anything about your code… (Ctrl+Enter to send)" rows="3"></textarea>
      <div id="input-footer">
        <label id="use-selection">
          <input type="checkbox" id="include-code" checked>
          Include editor code
        </label>
        <button id="send-btn" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Monaco loader -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
// ── Monaco setup ──────────────────────────────────────────────
let editor;
require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
require(['vs/editor/editor.main'], function () {
  editor = monaco.editor.create(document.getElementById('editor-container'), {
    value: '# Welcome to Local Code Editor\n# Powered by Qwen3-Coder-30B via Ollama\n\ndef greet(name: str) -> str:\n    """Return a greeting for the given name."""\n    return f"Hello, {name}!"\n\nif __name__ == "__main__":\n    print(greet("World"))\n',
    language: 'python',
    theme: 'vs-dark',
    fontSize: 14,
    fontFamily: "'Cascadia Code', 'Fira Code', Consolas, monospace",
    fontLigatures: true,
    minimap: { enabled: true },
    scrollBeyondLastLine: false,
    automaticLayout: true,
    wordWrap: 'off',
    tabSize: 4,
    insertSpaces: true,
    lineNumbers: 'on',
    renderWhitespace: 'selection',
    bracketPairColorization: { enabled: true },
  });

  editor.onDidChangeCursorPosition(e => {
    document.getElementById('cursor-pos').textContent =
      `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
  });

  // Ctrl+Enter to send
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => sendChat());
});

// Language selector
document.getElementById('language-select').addEventListener('change', e => {
  if (editor) {
    monaco.editor.setModelLanguage(editor.getModel(), e.target.value);
    updateFilenameExt(e.target.value);
  }
});

function updateFilenameExt(lang) {
  const exts = { python:'py', javascript:'js', typescript:'ts', java:'java',
                 cpp:'cpp', rust:'rs', go:'go', markdown:'md', json:'json', shell:'sh' };
  const cur = document.getElementById('filename-display').textContent;
  const base = cur.split('.')[0];
  document.getElementById('filename-display').textContent = `${base}.${exts[lang] || lang}`;
}

// ── File ops ─────────────────────────────────────────────────
const fileInput = Object.assign(document.createElement('input'), { type: 'file' });
function openFile() {
  fileInput.accept = '.py,.js,.ts,.java,.cpp,.rs,.go,.md,.json,.sh,.txt';
  fileInput.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    document.getElementById('filename-display').textContent = file.name;
    const ext = file.name.split('.').pop();
    const langMap = { py:'python', js:'javascript', ts:'typescript', java:'java',
                      cpp:'cpp', rs:'rust', go:'go', md:'markdown', json:'json', sh:'shell' };
    if (langMap[ext] && editor) {
      monaco.editor.setModelLanguage(editor.getModel(), langMap[ext]);
      document.getElementById('language-select').value = langMap[ext] || 'python';
    }
    file.text().then(t => { if (editor) editor.setValue(t); });
  };
  fileInput.click();
}

function saveFile() {
  const content = editor ? editor.getValue() : '';
  const name = document.getElementById('filename-display').textContent;
  const blob = new Blob([content], { type: 'text/plain' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}

function clearEditor() {
  if (editor) editor.setValue('');
  document.getElementById('filename-display').textContent = 'untitled.py';
}

// ── Chat helpers ─────────────────────────────────────────────
const history = document.getElementById('chat-history');
const typing  = document.getElementById('typing');

function getCode() {
  if (!editor) return '';
  const sel = editor.getSelection();
  const selected = editor.getModel().getValueInRange(sel);
  return selected.trim() ? selected : editor.getValue();
}

function appendMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Qwen3-Coder';
  const body = document.createElement('div');
  body.className = 'msg-body';
  div.append(label, body);
  history.appendChild(div);
  history.scrollTop = history.scrollHeight;
  return body;
}

function renderMarkdown(body, raw) {
  // Simple code block rendering
  const html = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const id = 'cb' + Math.random().toString(36).slice(2);
      return `<pre id="${id}"><button class="copy-btn" onclick="copyCode('${id}')">Copy</button><code>${code.trim()}</code></pre>` +
             `<button class="insert-btn" onclick="insertToEditor('${id}')">Insert into editor</button>`;
    })
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>');
  body.innerHTML = html;
  history.scrollTop = history.scrollHeight;
}

function copyCode(id) {
  const code = document.getElementById(id)?.querySelector('code')?.textContent || '';
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById(id)?.querySelector('.copy-btn');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
  });
}

function insertToEditor(id) {
  const code = document.getElementById(id)?.querySelector('code')?.textContent || '';
  if (!editor || !code) return;
  const pos = editor.getPosition();
  editor.executeEdits('insert', [{ range: new monaco.Range(pos.lineNumber, pos.column, pos.lineNumber, pos.column), text: '\n' + code + '\n' }]);
  editor.focus();
}

// ── Send request ─────────────────────────────────────────────
let generating = false;

async function doGenerate(prompt, code, action) {
  if (generating) return;
  generating = true;
  document.getElementById('send-btn').disabled = true;
  typing.classList.add('active');

  const aiBody = appendMsg('ai', '');
  let raw = '';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, code, action }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') break;
        try {
          const { text, error } = JSON.parse(payload);
          if (error) { raw += `\n\nError: ${error}`; break; }
          raw += text;
          renderMarkdown(aiBody, raw);
        } catch {}
      }
    }
  } catch (e) {
    raw = `Connection error: ${e.message}`;
    aiBody.textContent = raw;
  }

  typing.classList.remove('active');
  document.getElementById('send-btn').disabled = false;
  generating = false;
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const prompt = input.value.trim();
  if (!prompt && !generating) return;
  const includeCode = document.getElementById('include-code').checked;
  const code = includeCode ? getCode() : '';
  appendMsg('user', prompt);
  input.value = '';
  doGenerate(prompt, code, 'chat');
}

function runAction(action) {
  const code = getCode();
  if (!code.trim()) {
    alert('No code in editor. Write or paste some code first.'); return;
  }
  const labels = { explain:'Explain', fix:'Fix Bugs', complete:'Complete',
                   refactor:'Refactor', tests:'Write Tests', docstring:'Add Docs' };
  appendMsg('user', `[${labels[action] || action}] — ${code.length > 80 ? code.slice(0,80)+'…' : code}`);
  doGenerate('', code, action);
}

// Ctrl+Enter in textarea
document.getElementById('chat-input').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); sendChat(); }
});

// ── Resizer ───────────────────────────────────────────────────
const resizer   = document.getElementById('resizer');
const aiPanel   = document.getElementById('ai-panel');
let dragging = false, startX, startW;

resizer.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX; startW = aiPanel.offsetWidth;
  resizer.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const delta = startX - e.clientX;
  aiPanel.style.width = Math.max(280, Math.min(700, startW + delta)) + 'px';
});
document.addEventListener('mouseup', () => {
  dragging = false; resizer.classList.remove('dragging');
  document.body.style.userSelect = ''; document.body.style.cursor = '';
});

// ── Health check ─────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch('/health');
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    if (r.ok) {
      dot.className = 'ok';
      txt.textContent = 'Ready';
    } else {
      dot.className = 'err';
      txt.textContent = 'Ollama error';
    }
  } catch {
    document.getElementById('status-dot').className = 'err';
    document.getElementById('status-text').textContent = 'Offline';
  }
}
checkHealth();
setInterval(checkHealth, 10000);
</script>
</body>
</html>
